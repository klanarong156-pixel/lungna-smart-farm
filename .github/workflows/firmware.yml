name: Validate and build ESP8266 firmware

on:
  push:
    branches: [main]
    paths: ['firmware/esp8266/**', 'tests/**', '.github/workflows/firmware.yml']
  pull_request:
    paths: ['firmware/esp8266/**', 'tests/**', '.github/workflows/firmware.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static checks
        run: ./scripts/pre-deploy-check.sh

  firmware-build:
    needs: dashboard-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Install firmware packages
        working-directory: firmware/esp8266
        run: pio pkg install -e nodemcuv2
      - name: Apply upstream elf2bin warning fix
        working-directory: firmware/esp8266
        run: python -W error::SyntaxWarning scripts/patch_elf2bin_syntax_warning.py

      # Secrets are injected only into this step. Never echo them to the log.
      # If both are absent (e.g. a fork PR), create a safe placeholder header
      # for compile-only CI and skip publishing a firmware artifact.
      - name: Configure EMQX endpoint and CA for this build
        id: emqx
        working-directory: firmware/esp8266
        env:
          EMQX_SERVER: ${{ secrets.EMQX_SERVER }}
          EMQX_CA_PEM: ${{ secrets.EMQX_CA_PEM }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import subprocess
          import sys
          import tempfile

          server = os.environ.get("EMQX_SERVER", "").strip()
          ca = os.environ.get("EMQX_CA_PEM", "").strip().replace("\r\n", "\n")

          if bool(server) != bool(ca):
              sys.exit("Set both EMQX_SERVER and EMQX_CA_PEM, or leave both unset.")

          configured = bool(server and ca)
          if configured:
              # Hostname only: no scheme, path, or port. Reject characters that
              # could escape a C++ string literal in the generated header.
              if not re.fullmatch(r"[A-Za-z0-9.-]+", server) or server.startswith(".") or server.endswith(".") or ".." in server:
                  sys.exit("EMQX_SERVER must be a hostname only (no scheme, port, or path).")
              if "-----BEGIN CERTIFICATE-----" not in ca or "-----END CERTIFICATE-----" not in ca:
                  sys.exit("EMQX_CA_PEM must contain a PEM certificate.")
              if ")EMQXCA\"" in ca:
                  sys.exit("EMQX_CA_PEM contains an unsupported raw-string delimiter.")
              # Reject malformed or mixed PEM data before building. Validate
              # every certificate block, not only the first one in a bundle.
              blocks = re.findall(
                  r"-----BEGIN CERTIFICATE-----\s*.*?\s*-----END CERTIFICATE-----",
                  ca,
                  flags=re.DOTALL,
              )
              remainder = re.sub(
                  r"-----BEGIN CERTIFICATE-----\s*.*?\s*-----END CERTIFICATE-----",
                  "",
                  ca,
                  flags=re.DOTALL,
              )
              if not blocks or remainder.strip():
                  sys.exit("EMQX_CA_PEM must contain only one or more PEM certificates.")

              # Parse the CA bundle and verify the live broker certificate
              # chain and hostname. Never print certificate or OpenSSL output.
              with tempfile.NamedTemporaryFile(mode="w", encoding="utf-8") as ca_file:
                  ca_file.write(ca)
                  ca_file.flush()
                  parsed = subprocess.run(
                      ["openssl", "crl2pkcs7", "-nocrl", "-certfile", ca_file.name, "-out", os.devnull],
                      capture_output=True,
                      text=True,
                      timeout=15,
                  )
                  if parsed.returncode != 0:
                      sys.exit("EMQX_CA_PEM is not a valid PEM certificate bundle.")

                  try:
                      tls = subprocess.run(
                          [
                              "openssl", "s_client", "-brief", "-connect", f"{server}:8883",
                              "-servername", server, "-verify_hostname", server,
                              "-verify_return_error", "-CAfile", ca_file.name,
                          ],
                          input="",
                          capture_output=True,
                          text=True,
                          timeout=25,
                      )
                  except subprocess.TimeoutExpired:
                      sys.exit("Could not complete TLS verification with the EMQX endpoint in time.")
                  tls_output = tls.stdout + tls.stderr
                  if tls.returncode != 0 or not any(
                      marker in tls_output for marker in ("Verification: OK", "Verify return code: 0 (ok)")
                  ):
                      sys.exit("EMQX endpoint TLS certificate/hostname verification failed; no firmware artifact will be published.")
              print("EMQX CA bundle parsed and broker TLS certificate/hostname verified.")
          else:
              server = "YOUR_EMQX_SERVERLESS_ENDPOINT"
              ca = ""

          header = (
              "#pragma once\n"
              "// Generated by GitHub Actions. Do not add credentials here.\n"
              f'#define MQTT_SERVER "{server}"\n'
              "static const char MQTT_ROOT_CA_PEM[] PROGMEM = R\"EMQXCA(\n"
              f"{ca}\n"
              ")EMQXCA\";\n"
          )
          pathlib.Path("src/emqx_secrets.h").write_text(header, encoding="utf-8")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"configured={str(configured).lower()}\n")

          if configured:
              print("EMQX endpoint and CA were supplied for this build; values are not displayed.")
          else:
              print("EMQX secrets are absent; compile-only build uses safe placeholders and will not upload a firmware artifact.")
          PY

      - name: Build firmware
        working-directory: firmware/esp8266
        env:
          PYTHONWARNINGS: error::SyntaxWarning
        run: pio run -e nodemcuv2

      - name: Create versioned release image and checksum
        if: steps.emqx.outputs.configured == 'true'
        run: |
          cp firmware/esp8266/.pio/build/nodemcuv2/firmware.bin releases/firmware/SmartFarm_V7.2.1.bin
          sha256sum releases/firmware/SmartFarm_V7.2.1.bin > releases/firmware/SmartFarm_V7.2.1.bin.sha256

      - uses: actions/upload-artifact@v4
        if: steps.emqx.outputs.configured == 'true'
        with:
          name: SmartFarm_V7.2.1
          path: |
            releases/firmware/SmartFarm_V7.2.1.bin
            releases/firmware/SmartFarm_V7.2.1.bin.sha256
          if-no-files-found: error
          retention-days: 30
