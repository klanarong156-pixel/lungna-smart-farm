name: Validate and build ESP8266 firmware
on:
  push:
    branches: [main]
    paths: ['firmware/esp8266/**', 'tests/**', '.github/workflows/firmware.yml']
  pull_request:
    paths: ['firmware/esp8266/**', 'tests/**', '.github/workflows/firmware.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dashboard-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static checks
        run: |
          node --check dashboard/js/config.js
          node --check dashboard/js/state.js
          node --check dashboard/js/mqtt.js
          node --check dashboard/js/app.js
          node tests/state-contract.test.cjs
          node tests/mqtt-contract.test.cjs
          node tests/paths.test.cjs
          python -m json.tool dashboard/manifest.json >/dev/null
  firmware-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build firmware
        working-directory: firmware/esp8266
        run: pio run -e nodemcuv2
      - name: Create versioned release image and checksum
        run: |
          cp firmware/esp8266/.pio/build/nodemcuv2/firmware.bin releases/firmware/SmartFarm_V7.2.0.bin
          sha256sum releases/firmware/SmartFarm_V7.2.0.bin > releases/firmware/SmartFarm_V7.2.0.bin.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: SmartFarm_V7.2.0
          path: |
            releases/firmware/SmartFarm_V7.2.0.bin
            releases/firmware/SmartFarm_V7.2.0.bin.sha256
          if-no-files-found: error
          retention-days: 30
