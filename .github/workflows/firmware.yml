name: Validate and build ESP8266 firmware
on:
  push:
    branches: [main]
    paths: ['firmware/esp8266/**', 'tests/**', '.github/workflows/firmware.yml']
  pull_request:
    paths: ['firmware/esp8266/**', 'tests/**', '.github/workflows/firmware.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dashboard-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static checks
        run: ./scripts/pre-deploy-check.sh
  firmware-build:
    needs: dashboard-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Install firmware packages
        working-directory: firmware/esp8266
        run: pio pkg install -e nodemcuv2
      - name: Apply upstream elf2bin warning fix
        working-directory: firmware/esp8266
        run: python -W error::SyntaxWarning scripts/patch_elf2bin_syntax_warning.py
      - name: Build firmware
        working-directory: firmware/esp8266
        env:
          PYTHONWARNINGS: error::SyntaxWarning
        run: pio run -e nodemcuv2
      - name: Create versioned release image and checksum
        run: |
          cp firmware/esp8266/.pio/build/nodemcuv2/firmware.bin releases/firmware/SmartFarm_V7.2.0.bin
          sha256sum releases/firmware/SmartFarm_V7.2.0.bin > releases/firmware/SmartFarm_V7.2.0.bin.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: SmartFarm_V7.2.0
          path: |
            releases/firmware/SmartFarm_V7.2.0.bin
            releases/firmware/SmartFarm_V7.2.0.bin.sha256
          if-no-files-found: error
          retention-days: 30
