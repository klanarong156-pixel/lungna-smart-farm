name: Deploy dashboard to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['dashboard/**', '.github/workflows/pages.yml']
  pull_request:
    paths: ['dashboard/**', 'tests/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate static dashboard files
        run: |
          test -f dashboard/index.html
          test -f dashboard/manifest.json
          test -f dashboard/sw.js
          test -f dashboard/css/reference-layout.css
          test -f dashboard/assets/illustrations/farm-aerial.webp
          test -f dashboard/assets/illustrations/farm-landscape.webp
          ./scripts/pre-deploy-check.sh
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dashboard
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
