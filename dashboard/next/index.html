<!doctype html>
<html lang="th">
<head>

        <span><strong>สวนลุงนะ</strong><small>SMART FARM · NEXT</small></span>
      </a>
      <div class="farm-switcher"><span class="farm-avatar">สล</span><span><b>สวนลุงนะ</b><small>นครปฐม · 4.8 ไร่</small></span><span class="chevron">⌄</span></div>

          <button class="icon-button" type="button" data-action="show-notifications" aria-label="เปิดแจ้งเตือน">♢<span class="notification-badge">3</span></button>
          <button class="user-menu" type="button" data-action="show-profile"><span class="user-avatar">ลน</span><span class="user-copy"><b>ลุงนะ</b><small>ผู้ดูแลฟาร์ม</small></span><span>⌄</span></button>

      <footer class="site-footer"><span>สวนลุงนะ Smart Farm · Dashboard Next</span><span>ข้อมูลตัวอย่างสำหรับทดสอบ UX · <a href="../index.html">ดูระบบ MQTT เดิม</a></span></footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script src="./app.js" defer></script>
